<script>
const C0=[
{e:"🕵️",t:"The Job: Agents & Environments",w:"Week 1",
story:"Rain hammers the window of my office in Neon City. Someone has stolen the Golden Dataset from the city vault, and the case lands on my desk. Before I chase anyone, I need to know what I am: what I can sense, what I can do, and how I’ll be judged.",
pts:["An <b>agent</b> perceives its <b>environment</b> through <b>sensors</b> and acts through <b>actuators</b>. For Algo the sensors are eyes, ears and lab reports; the actuators are legs, radio and handcuffs. Everything else (the city, the suspects) is the environment.",
"A <b>rational agent</b> picks the action with the best <i>expected</i> result given what it knows. Rational does not mean all-knowing: following the best lead into a trap nobody could foresee is bad luck, not bad reasoning.",
"<b>PEAS</b> turns a vague job into a spec. <b>P</b>erformance: case solved fast, no innocent arrested. <b>E</b>nvironment: Neon City, rain, unreliable witnesses, a lying Phantom. <b>A</b>ctuators: patrol, interrogate, arrest. <b>S</b>ensors: cameras, fingerprints, statements.",
"Environment types: fully vs partially observable, deterministic vs stochastic, episodic vs sequential, static vs dynamic, discrete vs continuous. Neon City is partially observable, stochastic (witnesses make mistakes), sequential and dynamic (the Phantom keeps moving). A chess board is fully observable.",
"Agent designs, from simple to rich: <b>reflex</b> (if–then rules), <b>model-based</b> (remembers where the Phantom was last seen), <b>goal-based</b> (plans a route to the hideout), <b>utility-based</b> (weighs arresting too early against too late). Richer reasoning costs more computation."],
code:"def detective_reflex(percept):\n    if percept == 'alarm': return 'Rush to the vault'\n    elif percept == 'witness': return 'Interview witness'\n    elif percept == 'rain': return 'Put on trench coat'\n    return 'Keep watching'   # simple reflex agent: percept in, action out",
fact:"A burglar alarm is a genuine (very simple) reflex agent: sensor in, action out, no memory, no planning.",
q:{q:"Algo follows the most promising lead, but it turns out to be a trap nobody could have predicted. Was Algo irrational?",o:["Yes, a rational agent never fails","No, rationality is judged by the information available before acting","Only if Algo was a reflex agent"],a:1,why:"Rationality maximizes expected performance given the evidence; it is not omniscience."}},

{e:"🧭",t:"The Chase: Search & A*",w:"Week 2",
story:"x",
pts:["A <b>search problem</b> has four parts: a state space, a successor function (actions + costs), a start state and a goal test. A <b>solution</b> is a sequence of actions from start to goal. Here, states are junctions, actions are streets with a cost in minutes, and the goal test is “is this the Phantom’s hideout?”.",
"A <b>state-space graph</b> shows each junction once. A <b>search tree</b> lists every <i>path</i>, so it can repeat junctions and even go on forever (driving round the block). The <b>frontier</b> (fringe) holds the leads Algo has not yet followed; every algorithm differs only in which lead it picks next.",
"<b>BFS</b> checks the closest junctions first (FIFO queue): it finds the path with the fewest streets, but needs lots of memory. <b>DFS</b> follows one lead to the end of the alley (LIFO stack): little memory, but may return a long or non-optimal route.",
"<b>Iterative deepening</b> runs DFS with limits 1, 2, 3… streets to get DFS-like memory with BFS-like preference for shallow answers.",
"<b>UCS</b> always follows the lead with the smallest path cost <code>g(n)</code> (minutes driven so far), using a priority queue. With positive costs it is complete and optimal. A <b>visited set</b> means “don’t re-check a junction we have already been to”."],
code:"city = {'Office': ['Harbor', 'Casino'], 'Harbor': ['Docks', 'Bar'],\n        'Casino': ['Bar'], 'Docks': [], 'Bar': ['Hideout'], 'Hideout': []}\nfrom collections import deque\ndef bfs(graph, start, goal):\n    queue = deque([(start, [start])])\n    visited = {start}\n    while queue:\n        spot, path = queue.popleft()      # oldest lead first\n        if spot == goal: return path\n        for nxt in graph[spot]:\n            if nxt not in visited:\n                visited.add(nxt)\n                queue.append((nxt, path + [nxt]))\nprint(bfs(city, 'Office', 'Hideout'))  # ['Office','Harbor','Bar','Hideout']",
fact:"Swap popleft() for pop() and BFS becomes DFS. One line changes the whole strategy.",
q:{q:"Office→Harbor takes 2 min, Harbor→Hideout 10. Office→Casino takes 8, Casino→Hideout 1. Both routes use two streets. Which does UCS choose?",o:["Via Harbor (12 min)","Via Casino (9 min)","They tie"],a:1,why:"BFS sees equal depth; UCS compares total cost: 9 < 12."}},

{e:"⭐",t:"The Chase: Search & A*",w:"Week 2",
story:"x",
pts:["<code>g(n)</code> = exact cost so far (minutes driven). <code>h(n)</code> = <i>estimated</i> minutes left, the heuristic (the informant’s hunch). <b>A*</b> follows the lead with the smallest <code>f(n) = g(n) + h(n)</code>.",
"A heuristic is <b>admissible</b> if it never overestimates: <code>0 ≤ h(n) ≤ h*(n)</code>, where h* is the true remaining cost. Straight-line distance to the hideout is admissible, since no street is shorter than a straight line. On a block grid, Manhattan distance works.",
"<b>Why optimal?</b> Let A be the best way to the hideout and B a worse one on the frontier. Some ancestor n of A is also on the frontier, and f(n) ≤ g(A) &lt; g(B) = f(B). So n is expanded before B, and so is A. An overestimating hunch can break this.",
"If <code>h = 0</code>, A* is exactly UCS. Better hunches mean fewer junctions checked. (When using a visited set, the heuristic should also be <i>consistent</i>.)",
"A* cares about total <i>cost</i>, not number of streets. It finds the fewest-streets route only when every street costs the same."],
code:"import heapq\ngraph = {'Office': [('Harbor', 2), ('Casino', 8)], 'Harbor': [('Docks', 1), ('Bar', 5)],\n         'Casino': [('Bar', 1)], 'Docks': [('Hideout', 7)], 'Bar': [('Hideout', 2)], 'Hideout': []}\nh = {'Office': 6, 'Harbor': 5, 'Casino': 3, 'Docks': 6, 'Bar': 2, 'Hideout': 0}  # informant's hunch\ndef a_star(graph, h, start, goal):\n    pq = [(h[start], 0, start, [start])]   # (f, g, spot, path)\n    best = {start: 0}\n    while pq:\n        f, g, spot, path = heapq.heappop(pq)\n        if spot == goal: return g, path\n        for nxt, minutes in graph[spot]:\n            ng = g + minutes\n            if ng < best.get(nxt, float('inf')):\n                best[nxt] = ng\n                heapq.heappush(pq, (ng + h[nxt], ng, nxt, path + [nxt]))\nprint(a_star(graph, h, 'Office', 'Hideout'))  # (9, ['Office','Harbor','Bar','Hideout'])",
fact:"A* was published in 1968 by Hart, Nilsson and Raphael while building Shakey, one of the first mobile reasoning robots.",
q:{q:"Lead A: 4 minutes driven, 8 estimated left. Lead B: 7 driven, 2 estimated left. Which does A* follow?",o:["A, because it has lower g","B, because f=9 < 12","Neither"],a:1,why:"f(A)=12, f(B)=9. A* is happy to have paid more so far if the total looks better."}},

{e:"🚔",t:"The Stakeout Grid: Local Search",w:"Week 3",
story:"x",
pts:["<b>Local search</b> keeps one (or a few) complete candidate solutions and improves them step by step. Here a solution is a full patrol layout, and only the final layout matters, not how Algo got there. Key words: <b>state</b> (where each car is parked), <b>neighbor</b> (move one car), <b>objective function</b> (junctions covered, to maximize).",
"<b>Hill climbing</b> moves to a better neighbor until none exists. It can get stuck at a <b>local maximum</b> (a decent layout nobody can improve by one move), on a <b>plateau</b> (flat region) or along a <b>ridge</b>. <b>Random restarts</b> try again from different starting layouts.",
"<b>Simulated annealing</b> sometimes accepts a <i>worse</i> layout, with probability <code>e^(−Δ/T)</code>, where Δ &gt; 0 is how much worse the new layout is. High temperature T = adventurous; as T cools it behaves like hill climbing.",
"<b>Local beam search</b> tracks k layouts that share information. <b>Genetic algorithms</b> evolve a population of layouts using selection, crossover and mutation.",
"Detective versions of classic problems: patrol placement (maximize coverage, like <b>n-queens</b> avoiding conflicts) and visiting every witness by the shortest route (the <b>travelling salesperson</b>; neighbor = swap two stops). In continuous spaces, <b>gradient descent</b> follows the slope."],
code:"coverage = [1, 6, 4, 3, 9, 7, 2]   # junctions watched from parking spot 0..6\ndef hill_climb(coverage, i):\n    while True:\n        nbrs = [j for j in (i-1, i+1) if 0 <= j < len(coverage)]\n        best = max(nbrs, key=lambda j: coverage[j])\n        if coverage[best] <= coverage[i]: return i   # no better neighbor\n        i = best\nprint(hill_climb(coverage, 0))   # 1  -> stuck on a local maximum (6)\nprint(hill_climb(coverage, 3))   # 4  -> the true peak (9)",
fact:"Simulated annealing (Kirkpatrick et al., 1983) is borrowed from metallurgy: cool metal slowly and its atoms settle into a low-energy structure.",
q:{q:"Why might Algo sometimes accept a worse patrol layout (simulated annealing)?",o:["Because the old layout had a bug","To escape a local maximum","To save memory"],a:1,why:"Occasional downhill moves let the search leave a local peak; cooling then makes it settle."}},

{e:"♟️",t:"The Phantom’s Game: Adversarial Search",w:"Week 4",
story:"The Phantom isn’t running blindly; he’s playing me. Every move I make, he answers. To catch him I have to think two, four, six moves ahead and assume he’ll play his best.",
pts:["In <b>adversarial search</b> the opponent is part of the model. This is a two-player zero-sum game: Algo is <b>MAX</b> (maximize the chance of an arrest), the Phantom is <b>MIN</b> (minimize it). We need states, actions, transitions, terminal tests and utilities (+1 caught, −1 escaped).",
"<b>Minimax</b>: leaves get their utilities, MIN nodes take the minimum of children, MAX nodes the maximum, and values are backed up to the root. It gives the best outcome Algo can <i>guarantee</i> against a perfect Phantom. Cost: O(b<sup>m</sup>).",
"<b>Alpha–beta pruning</b> tracks α (best for MAX so far) and β (best for MIN so far) and skips branches once α ≥ β: if one street already lets the Phantom slip away, Algo stops studying it. It returns the <i>same</i> root value as minimax, faster. Good move ordering means more pruning.",
"Real chases are too deep, so we use a <b>depth limit</b> plus an <b>evaluation function</b>, e.g. a weighted sum of features (distance to the Phantom, exits covered…). Danger: the <b>horizon effect</b>, where trouble hides just beyond the cutoff.",
"<b>Expectimax</b> replaces MIN with <b>chance nodes</b> that take a probability-weighted average. Use it for random events (a guard’s patrol, a dice roll); assuming randomness against a smart Phantom is dangerously optimistic."],
code:"def minimax(state, algos_turn):\n    if is_terminal(state): return utility(state)   # +1 caught, -1 escaped\n    vals = [minimax(c, not algos_turn) for c in successors(state)]\n    return max(vals) if algos_turn else min(vals)  # Algo maximizes, Phantom minimizes",
fact:"Deep Blue beat world chess champion Garry Kasparov in 1997. AlphaGo beat Go star Lee Sedol in 2016 by mixing tree search with learned evaluation.",
q:{q:"Algo (MAX) picks one of three streets. The Phantom (MIN) then picks a reply with scores (3,12,8), (2,4,6) or (14,5,2). What is the minimax value?",o:["14","3","2"],a:1,why:"The Phantom picks 3, 2 and 2; Algo picks the largest: 3. The Phantom would never let Algo reach the 14."}},

{e:"⚖️",t:"The Big Gamble: Rational Decisions",w:"Week 8",
story:"Stakeout or raid? Wait too long and he vanishes; go in too early and I blow the case. Probability alone won’t tell me what to do. I have to weigh what each outcome is worth.",
pts:["A 90% chance of success is not enough. Outcomes differ in value, so we attach a <b>utility</b> U(o) to each. <b>Expected utility</b>: <code>EU(a) = Σ P(o|a)·U(o)</code>. The <b>MEU</b> rule picks <code>a* = argmax EU(a)</code>.",
"Stakeout: 90% a small win (+100), 10% blown cover (−20): 0.9×100 + 0.1×(−20) = 88. Raid: 60% the Phantom is home (+200), 40% a blown case (−50): 0.6×200 + 0.4×(−50) = 100. The raid is riskier, yet has the higher expected utility.",
"Risk attitudes: a risk-neutral detective maximizes expected value; a risk-averse one has concave utility and fears big losses.",
"<b>Backup rule:</b> if p is the probability the Phantom gets away, call for backup when <code>p &gt; C_backup / C_loss</code> (assuming backup would prevent the loss). With backup at $2,000 and a lost case at $10,000, the threshold is 0.20.",
"A model that predicts well is not automatically a good decision-maker. Predictions must be combined with costs."],
code:"actions = {'Stakeout': ([0.9, 0.1], [100, -20]), 'Raid': ([0.6, 0.4], [200, -50])}\nEU = lambda p, u: sum(x*y for x, y in zip(p, u))\nscores = {k: EU(*v) for k, v in actions.items()}\nprint(scores, max(scores, key=scores.get))   # {'Stakeout': 88, 'Raid': 100} Raid",
fact:"Expected utility theory goes back to von Neumann and Morgenstern (1944), the same von Neumann behind minimax.",
q:{q:"The chance the Phantom escapes is 0.15, an escape costs $20,000, and backup costs $2,000. What should Algo do?",o:["Skip backup, 15% is small","Call backup: expected loss $3,000 > $2,000","Cannot be decided"],a:1,why:"0.15 × 20,000 = 3,000, which exceeds the cost of backup, so call it."}},

{e:"🔍",t:"Reading the Clues: Probability & Bayesian Networks",w:"Week 6",demo:"bayes",
story:"The lab says the fingerprint matches, and their test is 95% accurate. Case closed? Not so fast. In this city, evidence lies, and the only honest way to update my suspicions is Bayes.",
pts:["A <b>random variable</b> maps uncertain outcomes to values; a <b>distribution</b> sums to 1. <b>Conditional probability</b> P(A|B) restricts attention to cases where B holds: the Phantom struck on 24 of 30 rainy nights, so P(strike | rain) = 80%.",
"<b>Bayes’ theorem</b>: <code>P(H|D) = P(D|H)·P(H) / P(D)</code>, with prior, likelihood and posterior. Do not confuse P(flag | guilty) with P(guilty | flag).",
"The trap: 1% of 10,000 suspects are accomplices (prior). The lab flags 95% of the guilty and also 10% of the innocent. That is 95 guilty plus 990 innocent flagged, so P(guilty | flagged) = 95/1085 ≈ <b>8.76%</b>. Try the sliders below.",
"A <b>Bayesian network</b> is a directed acyclic graph with a conditional probability table (CPT) per node. It factorizes the joint distribution into small pieces. Fork: Phantom nearby → camera glitch and → radio ping. Collider: alarm caused by the Phantom <i>or</i> a stray cat. Spot the cat and the Phantom becomes less likely: <b>explaining away</b>.",
"<b>Inference</b>: exact by enumeration or variable elimination; approximate by sampling (prior, rejection, likelihood weighting, Gibbs). Models must be validated; they are only as good as their assumptions."],
code:"def posterior(prior, sens, fpr):\n    p_flag = sens * prior + fpr * (1 - prior)   # P(flagged), total probability\n    return sens * prior / p_flag               # Bayes' theorem\nprint(posterior(0.01, 0.95, 0.10))   # 0.0876 -> only 8.76% guilty",
fact:"Thomas Bayes’ essay was published after his death, in 1763. Judea Pearl’s work in the 1980s made Bayesian networks a core AI tool.",
q:{q:"Why does a lab that flags 95% of the guilty still leave only about a 9% chance that a flagged suspect is guilty?",o:["The lab is broken","Guilty people are rare, so false flags outnumber true ones","Bayes’ theorem does not apply"],a:1,why:"A low base rate (1%) means most flags come from the huge innocent group."}},

{e:"🌫️",t:"Shadows in the Fog: Hidden Markov Models",w:"Week 7",
story:"I can’t see where the Phantom is hiding. All I get are noisy clues: a camera glitch, a radio ping, a whiff of cigar smoke. The truth is a hidden state, and I have to track it through the fog.",
pts:["An HMM has <b>hidden states</b> that change over time (the Phantom is <i>Hiding</i> or <i>Moving</i>) and <b>observations</b> that depend on them (radio ping, quiet). The <b>Markov assumption</b>: the next state depends only on the current one.",
"Two tables define it: <b>transitions</b> P(next | current) and <b>emissions</b> P(observation | state). Each row sums to 1. Example: Hiding→Moving = 0.10, Moving→Hiding = 0.20; a ping is more likely while Moving.",
"<b>Prediction</b>: p<sub>t+1</sub> = p<sub>t</sub> × T. Starting certain of Hiding with the matrix [[0.9,0.1],[0.2,0.8]] gives (0.9, 0.1). A ping then <i>updates</i> the belief to about (0.56, 0.44).",
"<b>Filtering</b> estimates the current state from all evidence so far (<i>sums</i> over paths). <b>Smoothing</b> revises past states using later evidence. <b>Viterbi</b> finds the single most likely whole route (uses <i>max</i>).",
"Uses: speech recognition, gesture tracking, tracking moving targets, machine health monitoring, bioinformatics."],
code:"T = [[0.9, 0.1], [0.2, 0.8]]   # rows: from Hiding, from Moving\nE = [[0.1, 0.9], [0.7, 0.3]]   # [P(ping), P(quiet)] in Hiding / Moving\ndef predict(b):\n    return [sum(b[i] * T[i][j] for i in range(2)) for j in range(2)]\ndef filter_step(b, obs):        # obs 0 = ping, 1 = quiet\n    b = predict(b)\n    b = [b[s] * E[s][obs] for s in range(2)]\n    z = sum(b)\n    return [x / z for x in b]\nprint(filter_step([1.0, 0.0], 0))   # [0.5625, 0.4375] after a radio ping",
fact:"Andrew Viterbi published his algorithm in 1967 for decoding noisy communication signals.",
q:{q:"Filtering uses SUM over earlier states. What does Viterbi use?",o:["MAX, to keep the best route","MIN","Average"],a:0,why:"Viterbi asks for the single best sequence, so it keeps the maximum at each step."}},

{e:"🗂️",t:"The Case Files: Classical Machine Learning",w:"Week 9",
story:"Down in the archive, a thousand old case files gather dust. Maybe I don’t have to write every rule by hand. Let the files teach a model what a Phantom job looks like.",
pts:["Classical programming: humans write rules. <b>ML</b>: a model ŷ = f<sub>θ</sub>(x) is fitted to data. Three paradigms: <b>supervised</b> (case files with known outcomes), <b>unsupervised</b> (find structure, no labels), <b>reinforcement</b> (learn from reward).",
"<b>Regression</b> predicts a number (e.g. the loss of a heist). Linear regression ŷ = wx + b minimizes MSE = (1/n)Σ(y−ŷ)². <b>Classification</b> predicts a class (Phantom job or not); <b>logistic regression</b> squeezes a score through the sigmoid σ(z) = 1/(1+e<sup>−z</sup>) into a probability.",
"<b>Decision trees</b> are readable if–then splits (night? vault district? high-value loot?) but can overfit. A <b>random forest</b> averages many trees trained on varied data to be more stable.",
"<b>K-means</b> clusters unlabelled cases, for example by place and time: assign points to the nearest centre, move centres to the mean, repeat.",
"Evaluate with Precision = TP/(TP+FP), Recall = TP/(TP+FN), F1, and a held-out test set. <b>High accuracy ≠ good decisions</b>: on imbalanced files a model can look great and miss every Phantom job."],
code:"from sklearn.linear_model import LogisticRegression\nmodel = LogisticRegression().fit(X_train, y_train)    # old case files\np = model.predict_proba([[3, 9.5]])[0, 1]             # 3 a.m., high-value loot\nif p > 2000 / 10000: print('Send backup')            # ML + decision theory",
fact:"Random forests were introduced by Leo Breiman in 2001.",
q:{q:"99% of old case files are ordinary thefts. A model always says “not a Phantom job”. What are its accuracy and recall for Phantom jobs?",o:["99% and 99%","99% and 0%","1% and 0%"],a:1,why:"It is right 99% of the time but finds none of the Phantom jobs, so recall is 0."}},

{e:"🏙️",t:"Street Smarts: MDPs & Reinforcement Learning",w:"Week 5",
story:"No map exists for this city’s back streets. Every move teaches me something: a reward for a good lead, a penalty for a dead end. Years on the beat turn into a policy that tells me what to do at every corner.",
pts:["A <b>Markov decision process</b> has states (where Algo is and what he knows), actions (follow a lead, wait, call the informant), transition probabilities P(s′|s,a), rewards (+10 good lead, −1 per minute, −5 dead end) and a discount γ. Search returns a <i>path</i>; an MDP solution is a <b>policy</b> π(s): what to do at every corner.",
"<b>Return</b> G = R₁ + γR₂ + γ²R₃ + … Three leads paying 5, 10, 20 with γ=0.9 give 5 + 9 + 16.2 = 30.2. Reward is immediate; <b>value</b> is long-term. <b>V(s)</b> rates places; <b>Q(s,a)</b> rates actions in places.",
"<b>Bellman idea</b>: value = immediate reward + discounted value of what follows. <b>Value iteration</b> repeats this backup until values settle; information about the hideout flows backward along the streets.",
"If the city’s rules are unknown, use <b>reinforcement learning</b>. Algo must balance <b>exploration</b> (try an unknown alley) and <b>exploitation</b> (use the best known lead); ε-greedy takes a random action with probability ε.",
"<b>Q-learning</b> updates <code>Q ← Q + α[r + γ·max Q(s′,·) − Q]</code>. α = learning rate, γ = discount, ε = exploration. <b>SARSA</b> is the on-policy cousin. For huge state spaces, <b>DQN</b> uses a neural network for Q; <b>actor–critic</b> learns a policy and a value together. Real systems need hard safety limits, not just reward."],
code:"q, r, best_next, alpha, gamma = 4.0, 2.0, 8.0, 0.5, 0.9\n# q = Q(Harbor, follow lead), r = reward, best_next = max Q(Bar, .)\ntarget = r + gamma * best_next      # 9.2\nq = q + alpha * (target - q)        # 6.6\nprint(q)",
fact:"Q-learning was introduced by Chris Watkins in 1989; DeepMind’s DQN learned to play Atari games from pixels (Nature, 2015).",
q:{q:"Q(Harbor, follow lead)=4, reward r=2, max Q(Bar,·)=8, γ=0.9, α=0.5. What is the new Q?",o:["9.2","6.6","5.2"],a:1,why:"Target = 2 + 0.9·8 = 9.2; error = 5.2; new Q = 4 + 0.5·5.2 = 6.6."}}
];

addEventListener("touchend",e=>{if(!tOK)return;tOK=false;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
 if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy))go(dx<0?1:-1)},{passive:true});
addEventListener("hashchange",()=>{const k=location.hash.slice(1)||"cover";if(k!==cur)show(k)});route();
</script>
